<!doctype html><html><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Avenir Next',sans-serif}#art{position:relative;isolation:isolate;overflow:hidden}.photo,.shade{position:absolute;inset:0}.photo{background-size:cover;background-position:65% 46%;opacity:.4}.shade{background:linear-gradient(100deg,var(--paper) 3%,color-mix(in srgb,var(--paper) 93%,transparent) 39%,color-mix(in srgb,var(--paper) 8%,transparent) 100%)}.copy{position:absolute;z-index:4}h1{margin:0;font-weight:760;line-height:1.06;letter-spacing:-.025em;text-wrap:balance;white-space:pre-line}.brand{display:flex;gap:.3em;align-items:center;font-weight:650;line-height:1.1;margin-bottom:.65em}.brand img{width:1.8em;height:1.8em;border-radius:23%}.device{position:absolute;z-index:2;filter:drop-shadow(0 30px 40px #0005)}.backplate{position:absolute;background:#161616;z-index:0}.screen,.hardware{position:absolute;display:block}.hardware{width:100%;height:100%;z-index:1}.screen{object-fit:contain;background:#000}.native-window{border-radius:28px;overflow:hidden;border:2px solid #fff5;background:#20202a}.native-window .screen{inset:0;width:100%;height:100%}.prop{position:absolute;z-index:3;object-fit:contain;filter:drop-shadow(0 14px 16px #0003)}.detail{position:absolute;z-index:4;overflow:hidden;border-radius:35px;box-shadow:0 24px 45px #0005;transform:rotate(-3deg);border:3px solid #fff8}.detail img{position:absolute}
</style><main id="art"><div class="photo"></div><div class="shade"></div><div class="copy"><div class="brand"><img><span></span></div><h1></h1></div><div class="device"><div class="backplate"></div><img class="screen"><img class="hardware"></div><img class="prop"><div class="detail"><img></div></main><script>
window.render=async c=>{const q=s=>document.querySelector(s),W=c.width,H=c.height,header=c.placement==='header',rtl=c.direction==='rtl';q('#art').style.cssText=`width:${W}px;height:${H}px;--paper:${c.palette[0]};color:${c.palette[1]}`;q('.photo').style.backgroundImage=c.background?`url('${c.background}')`:'none';q('.photo').style.opacity=c.slug==='tumtum'?'.14':header?'.8':'.24';q('.brand img').src=c.icon;q('.brand span').textContent=c.name;q('h1').textContent=c.headline;q('.copy').dir=rtl?'rtl':'ltr';q('h1').style.letterSpacing=rtl?'0':'-.025em';q('.copy').style.cssText=`left:${W*.065}px;top:${H*(header?.08:.15)}px;width:${W*(header?.53:.49)}px`;q('.brand').style.fontSize=W*.037+'px';let fs=W*(header?.083:.09);q('h1').style.fontSize=fs+'px';document.documentElement.lang=c.locale||'en';q('h1').style.hyphens='none';q('h1').style.overflowWrap='normal';await document.fonts.ready;let limit=H*(header?.94:.85);while((q('.copy').getBoundingClientRect().bottom>limit||q('.copy').scrollWidth>q('.copy').clientWidth)&&fs>W*.068){fs=Math.max(W*.068,fs-2);q('h1').style.fontSize=fs+'px'}
if(q('.copy').getBoundingClientRect().bottom>limit||q('.copy').scrollWidth>q('.copy').clientWidth){q('.copy').style.width=W*(header?.68:.62)+'px';q('.copy').style.top=H*.045+'px';}q('.device').style.display=header?'none':'block';q('.screen').src=c.capture||c.icon;q('.hardware').style.display=c.frame?'block':'none';q('.device').className='device'+(!c.frame?' native-window':'');if(c.frame){q('.hardware').src=c.frame.asset;const[fw,fh]=c.frame.dimensions,[x,y,w,h]=c.frame.screen;let dw=W*(fw/fh<.85?.34:.44);q('.device').style.cssText=`display:${header?'none':'block'};left:${W*(fw/fh<.85?.60:.52)}px;top:${H*(fw/fh<.85?.13:.24)}px;width:${dw}px;height:${dw*fh/fw}px;transform:rotate(5deg)`;q('.screen').style.cssText=`left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%;border-radius:${fw/fh<.85?45:5}px`}
else{const ratio=c.captureRatio||1.6;q('.device').style.cssText=`display:${header?'none':'block'};left:${W*.53}px;top:${H*.37}px;width:${W*.46}px;height:${W*.46/ratio}px;transform:rotate(3deg)`;q('.screen').style.cssText='inset:0;width:100%;height:100%'}
q('.prop').style.display=c.prop?'block':'none';if(c.prop){q('.prop').src=c.prop;q('.prop').style.cssText=`display:block;right:${W*.07}px;top:${H*(header?.09:.69)}px;width:${W*(header?.30:.17)}px;height:${H*(header?.81:.28)}px;transform:rotate(-7deg)`}
if(c.brandOnly){q('.device').style.display='none';q('.photo').style.opacity=header?'.85':'.75';}q('.backplate').style.display=c.frame?.backplate?'block':'none';if(c.frame?.backplate){const [fw,fh]=c.frame.dimensions,[x,y,w,h]=c.frame.backplate;q('.backplate').style.cssText=`display:block;left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%`;}if(!header&&q('.copy').getBoundingClientRect().width>W*.52){const left=q('.copy').getBoundingClientRect().right+W*.025,dw=W-left-W*.045;q('.device').style.left=left+'px';q('.device').style.width=dw+'px';q('.device').style.height=(dw/(c.frame?c.frame.dimensions[0]/c.frame.dimensions[1]:c.captureRatio||1.6))+'px';}q('.detail').style.display='none';await Promise.all([...document.images].filter(x=>x.style.display!=='none'&&x.getAttribute('src')).map(i=>i.decode()));return{copy:q('.copy').getBoundingClientRect().toJSON(),fonts:{headline:fs*390/W},dimensions:[W,H],captureSize:[q('.screen').naturalWidth,q('.screen').naturalHeight],overflow:q('.copy').scrollWidth>q('.copy').clientWidth};};
</script></html>
