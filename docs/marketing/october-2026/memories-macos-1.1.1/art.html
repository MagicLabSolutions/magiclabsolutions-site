<!doctype html><html lang="en"><meta charset="utf-8"><title>Memories native Mac store artwork</title><style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}.art{position:relative;width:2880px;height:1800px;overflow:hidden;isolation:isolate;background:#f2f6f5;color:#0f2a30}.scene,.veil{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:45% 58%}.veil{z-index:-1;background:linear-gradient(110deg,#f2f6f5fc 2%,#f2f6f5ed 40%,#f2f6f555 100%)}.brand{position:absolute;left:130px;top:80px;display:flex;align-items:center;gap:24px;font-size:62px;font-weight:650}.brand img{width:94px;height:94px;border-radius:23%}.copy{position:absolute;left:130px;top:270px;width:1000px;z-index:5}h1{margin:0;font-size:236px;font-weight:760;letter-spacing:-.04em;line-height:1.06;text-wrap:balance;overflow-wrap:normal;hyphens:none}.description{margin:70px 0 0;font-size:118px;line-height:1.26;text-wrap:balance;overflow-wrap:normal}.device{position:absolute;left:1020px;top:410px;width:1860px;height:1240px;filter:drop-shadow(0 34px 55px #0f2a3040)}.hardware,.native,.display{position:absolute;display:block}.hardware{inset:0;width:100%;height:100%;z-index:2}.display{background:#fff}.native{object-fit:contain;background:#fff;border-radius:8px}.cutout{position:absolute;z-index:4;overflow:hidden;outline:6px solid #fff;box-shadow:0 25px 60px #0f2a3038;transform:rotate(-2deg);background:#f6f7f8}.cutout img{position:absolute;max-width:none;display:block}[data-panel="1"]{color:#fff}[data-panel="1"] .veil{background:linear-gradient(110deg,#062a2ef2 2%,#062a2ec5 38%,#062a2e22 100%)}[data-panel="2"] .scene{background-position:90% 45%}[data-panel="3"] .scene{background-position:15% 70%}[data-panel="5"] .veil{background:linear-gradient(110deg,#eff5f2fd,#eff5f2ee 40%,#eff5f27c)}[dir="rtl"] h1{letter-spacing:0}
</style><main class="art" id="art"><div class="scene"></div><div class="veil"></div><div class="brand"><img id="icon" alt=""><span>Memories</span></div><div class="copy"><h1></h1><p class="description"></p></div><div class="device"><div class="display"></div><img class="native" alt="Current Memories Mac Catalyst interface"><img class="hardware" alt="Original Apple MacBook Pro hardware"></div><div class="cutout"><img alt="Complete native interface component"></div></main><script>
window.render=async c=>{
 document.documentElement.lang=c.locale;const art=document.querySelector('#art');art.dataset.panel=c.number;document.querySelector('.copy').dir=c.direction;document.querySelector('.brand span').textContent=c.number===6?'Memories · Plus':'Memories';
 document.querySelector('.scene').style.backgroundImage=`url("${c.background}")`;document.querySelector('#icon').src=c.icon;

 const copy=document.querySelector('.copy'),device=document.querySelector('.device');Object.assign(copy.style,{left:(c.wide?140:130)+'px',top:(c.wide?230:270)+'px',width:(c.wide?2600:1000)+'px',textAlign:c.wide?'center':'start'});Object.assign(device.style,{left:(c.wide?140:1020)+'px',width:(c.wide?2600:1860)+'px',height:(c.wide?2600:1860)*2840/4260+'px'});
 const [x,y,w,h]=c.frame.screen,[fw,fh]=c.frame.dimensions;Object.assign(document.querySelector('.display').style,{left:x/fw*100+'%',top:y/fh*100+'%',width:w/fw*100+'%',height:h/fh*100+'%'});Object.assign(native.style,{left:x/fw*100+'%',top:(y+72)/fh*100+'%',width:w/fw*100+'%',height:(h-72)/fh*100+'%'});
 await Promise.all([...document.images].map(i=>i.decode()));await document.fonts.ready;
 device.style.top=(c.wide?copy.getBoundingClientRect().bottom+70:410)+'px';
 if(c.wide&&c.number===5){const top=copy.getBoundingClientRect().bottom+70,width=Math.min(2600,(1755-top)/((303+72)/4260+3456/4260/2400*1120));Object.assign(device.style,{left:(2880-width)/2+'px',width:width+'px',height:width*2840/4260+'px'});}
 const cut=document.querySelector('.cutout');cut.style.display=c.rect?'block':'none';
 if(c.rect){const [l,t,r,b]=c.rect,preferred=c.number===2?700:c.number===6?1000:c.wide?1450:1250,cw=c.wide?Math.min(preferred,(1760-copy.getBoundingClientRect().bottom-90)*(r-l)/(b-t)):preferred,scale=cw/(r-l),ch=(b-t)*scale;const cy=1760-ch;Object.assign(cut.style,{left:(c.number===2?2740-cw:c.number===6?2760-cw:c.wide?1320:1510)+'px',top:cy+'px',width:cw+'px',height:ch+'px',borderRadius:28*scale+'px'});Object.assign(cut.firstElementChild.style,{width:native.naturalWidth*scale+'px',height:native.naturalHeight*scale+'px',left:-l*scale+'px',top:-t*scale+'px'});}
 const bounds=q=>document.querySelector(q).getBoundingClientRect().toJSON();
 return {copy:bounds('.copy'),device:bounds('.device'),card:c.rect?bounds('.cutout'):null,source:[native.naturalWidth,native.naturalHeight],annualContentBottom:c.wide&&c.number===5?bounds('.device').y+bounds('.device').width*((303+72)/4260+3456/4260/2400*1120):null,nativeContentInset:72,wideLayout:!!c.wide,headline:236,description:118,copyOverflow:document.querySelector('.copy').scrollWidth>(c.wide?2600:1000)};
};
