<!doctype html><html><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Avenir Next',sans-serif}#art{position:relative;overflow:hidden;isolation:isolate;background:#f3f0e9;color:#242145}.scene,.veil{position:absolute;inset:0;background-size:cover;background-position:65% 45%;z-index:-2}.veil{z-index:-1;background:linear-gradient(110deg,#f3f0e9ff 0%,#f3f0e9e8 42%,#f3f0e9aa 100%)}.hero{color:#fffaf1!important;background:#202b41!important}.hero .veil{background:linear-gradient(110deg,#202b41f9,#202b41c9 42%,#202b4150)}.brand{position:absolute;display:flex;align-items:center;font-weight:650;gap:.4em}.brand img{width:1.5em;height:1.5em;border-radius:23%}.copy{position:absolute;z-index:5}h1{margin:0;font-weight:760;line-height:1.06;letter-spacing:-.035em;text-wrap:balance}.desc{line-height:1.27;text-wrap:balance;margin:.45em 0 0}.device{position:absolute;filter:drop-shadow(0 30px 45px #0004)}.screen,.hardware{position:absolute;display:block}.screen{object-fit:contain;background:#000}.hardware{inset:0;width:100%;height:100%;z-index:2}.vision .screen{inset:0;width:100%;height:100%;border-radius:35px}.vision .device{border-radius:35px;overflow:hidden;border:2px solid #fff6;background:#181818}.detail{position:absolute;z-index:4;overflow:hidden;border:3px solid #fff8;box-shadow:0 20px 45px #0005;transform:rotate(-2deg);border-radius:24px}.detail img{position:absolute;max-width:none}
</style><main id="art"><div class="scene"></div><div class="veil"></div><div class="brand"><img><span>Kinfold</span></div><div class="copy"><h1></h1><p class="desc"></p></div><div class="device"><img class="screen"><img class="hardware"></div><div class="detail"><img></div></main><script>
window.render=async c=>{const q=s=>document.querySelector(s),W=c.width,H=c.height,vision=c.platform==='vision',hero=c.number===1;document.documentElement.lang=c.locale;q('h1').style.hyphens='auto';q('h1').style.overflowWrap='break-word';q('#art').className=(hero?'hero ':'')+(vision?'vision':'');q('#art').style.cssText=`width:${W}px;height:${H}px`;q('.scene').style.backgroundImage=`url('${c.background}')`;q('.brand img').src=c.icon;q('.brand').style.cssText=`left:${W*.055}px;top:${H*.045}px;font-size:${W*.031}px`;q('.copy').dir=c.direction;q('h1').style.letterSpacing=c.direction==='rtl'?'0':'-.035em';q('h1').textContent=c.headline.replaceAll('\n',' ');q('.desc').textContent=c.description.replaceAll('\n',' ');q('h1').style.fontSize=W*.082+'px';q('.desc').style.fontSize=W*.042+'px';q('.copy').style.cssText=`left:${W*.055}px;top:${H*.16}px;width:${W*.44}px`;q('.screen').src=c.capture;q('.hardware').style.display=vision?'none':'block';if(!vision)q('.hardware').src=c.frame.asset;await Promise.all([...document.images].filter(i=>i.getAttribute('src')).map(i=>i.decode()));await document.fonts.ready;
let wide=false,dx=W*.50,dw=W*.52,dy=H*.24;let hf=W*.082;while((q('.copy').getBoundingClientRect().bottom>H*.93||q('.copy').scrollWidth>q('.copy').clientWidth)&&hf>W*.072){hf-=2;q('h1').style.fontSize=hf+'px'}const ratio=vision?q('.screen').naturalWidth/q('.screen').naturalHeight:c.frame.dimensions[0]/c.frame.dimensions[1];q('.device').style.cssText=`left:${dx}px;top:${dy}px;width:${dw}px;height:${dw/ratio}px`;
if(!vision){const[fw,fh]=c.frame.dimensions,[x,y,w,h]=c.frame.screen;q('.screen').style.cssText=`left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%;border-radius:8px`}else q('.screen').style.cssText='inset:0;width:100%;height:100%';
q('.detail').style.display=c.detail?'block':'none';if(c.detail){const[l,t,r,b]=c.detail.rect,preferred=W*.44,cw=Math.min(preferred,H*.32*(r-l)/(b-t)),scale=cw/(r-l),ch=(b-t)*scale,cx=W*.985-cw,cy=H*.965-ch;q('.detail').style.cssText=`display:block;left:${cx}px;top:${cy}px;width:${cw}px;height:${ch}px`;q('.detail img').src=c.detail.source;await q('.detail img').decode();const im=q('.detail img');im.style.cssText=`width:${im.naturalWidth*scale}px;height:${im.naturalHeight*scale}px;left:${-l*scale}px;top:${-t*scale}px`}
return{copy:q('.copy').getBoundingClientRect().toJSON(),device:q('.device').getBoundingClientRect().toJSON(),detail:c.detail?q('.detail').getBoundingClientRect().toJSON():null,wide,fonts:{headline:hf*390/W,description:W*.042*390/W},overflow:q('.copy').scrollWidth>q('.copy').clientWidth||q('.copy').getBoundingClientRect().bottom>H*.97,sourceSize:[q('.screen').naturalWidth,q('.screen').naturalHeight]};};
</script></html>
