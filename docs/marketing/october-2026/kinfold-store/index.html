<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinfold · English App Store artwork</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#242145;font-family:system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:40px 24px}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-.04em;margin:0 0 16px}h2{font-size:30px;margin:48px 0 20px}p,a{font-size:18px;line-height:1.6}a{color:#514ac6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}figure{margin:0}img{display:block;width:100%;height:auto;border-radius:8px}figcaption{font-size:18px;line-height:1.4;margin-top:12px;font-weight:650}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}main{padding:28px 16px}figcaption{font-size:16px}}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>Kinfold, ready for the next chapter.</h1><p>Six App Store images for iPhone and six for iPad. English review set with native app captures and original Apple hardware.</p><p><a href="kinfold-app-store-en-US.zip" download>Download all 12 PNGs</a></p><h2>iPhone</h2><section class="grid" id="iphone"></section><h2>iPad</h2><section class="grid" id="ipad"></section></main><script>
const labels=['Your family. Ready to go.','Details ready. In a tap.','Every trip. One clear plan.','Pack for everyone. Forget less.','Keep the family on the same page.','Find it. Get on with it.'];
for(const platform of ['iphone','ipad'])for(let i=1;i<=6;i++){const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=`previews/en-US/${platform==='iphone'?'store':'ipad-store'}-${i}-390.jpg`;img.alt=`Kinfold ${platform} image ${i}: ${labels[i-1]}`;img.loading='lazy';caption.textContent=`${i}. ${labels[i-1]}`;figure.append(img,caption);document.getElementById(platform).append(figure)}
</script></body></html>
