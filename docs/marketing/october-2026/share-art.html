<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MagicLab link preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}.art{width:1200px;height:630px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);isolation:isolate}.scene{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-3}.veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--paper) 0%,color-mix(in srgb,var(--paper),transparent 4%) 42%,color-mix(in srgb,var(--paper),transparent 72%) 100%);z-index:-2}.brand{position:absolute;left:58px;top:45px;display:flex;align-items:center;gap:18px;font-size:32px;font-weight:650}.brand img{width:65px;height:65px;border-radius:24%}.copy{position:absolute;left:58px;top:153px;width:625px;z-index:4}h1{font-size:80px;line-height:1.04;letter-spacing:-.045em;margin:0;white-space:pre-line;font-weight:760}.description{font-size:32px;line-height:1.28;margin:28px 0 0;white-space:pre-line;max-width:590px}.device{position:absolute;left:735px;top:63px;transform:rotate(5deg);transform-origin:50% 30%;width:435px}.capture{position:absolute;object-fit:contain}.bezel{position:absolute;inset:0;width:100%;height:100%;z-index:2}.desktop .device{left:690px;top:215px;width:650px;border:7px solid #29323c;border-radius:14px;background:#101621;box-shadow:0 24px 55px #0004;transform:rotate(-5deg)}.desktop .capture{position:relative;display:block;width:100%;height:auto}.desktop h1{font-size:76px}.desktop .copy{width:630px}.footer{position:absolute;left:58px;bottom:38px;font-size:22px;opacity:.7;z-index:4}.prop{position:absolute;left:1050px;top:455px;width:150px;transform:rotate(9deg);z-index:3;filter:drop-shadow(0 10px 16px #0002)}
</style></head><body><main class="art"><div class="scene"></div><div class="veil"></div><div class="brand"><img id="icon" alt=""><span id="name"></span></div><div class="copy"><h1></h1><p class="description"></p></div><div class="device"><img class="capture" alt=""><img class="bezel" alt=""></div><div class="props"></div><span class="footer">magiclabsolutions.com</span></main><script>
window.renderShare=async p=>{
 const art=document.querySelector('.art'),cfg=p.studio_art||p.store_pilot||{},bg=cfg.hero_background||p.background;document.documentElement.style.cssText=`--paper:${p.palette[0]};--ink:${p.palette[1]}`;art.className='art '+(['mac','web'].includes(p.device)?'desktop':'');document.querySelector('.scene').style.backgroundImage=`url('${bg}')`;const image=new Image();image.src=bg;await image.decode();document.querySelector('#icon').src=p.icon;document.querySelector('#name').textContent=p.name;document.querySelector('h1').textContent=p.share_preview.headline;document.querySelector('.description').textContent=p.share_preview.description;
 const cap=document.querySelector('.capture'),device=document.querySelector('.device'),bezel=document.querySelector('.bezel');cap.src=p.screens[0];bezel.hidden=!p.frame;if(p.frame)bezel.src=p.frame.asset;document.querySelector('.props').replaceChildren();
 const asset=p.slug==='giftly'?cfg.gift:(cfg.props||[])[0]?.asset;if(asset){const im=document.createElement('img');im.src=asset;im.className='prop';im.alt='';document.querySelector('.props').append(im)}
 await Promise.all([...document.images].filter(i=>i.getAttribute('src')).map(i=>i.decode()));await document.fonts.ready;
 if(p.frame){const [fw,fh]=p.frame.dimensions,[x,y,w,h]=p.frame.screen,s=device.getBoundingClientRect().width/fw;device.style.height=435*fh/fw+'px';cap.style.cssText=`left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%;border-radius:${(p.frame.radius||150)*435/fw}px`}
 return {copy:document.querySelector('.copy').getBoundingClientRect().toJSON(),title:document.querySelector('h1').getBoundingClientRect().toJSON(),description:document.querySelector('.description').getBoundingClientRect().toJSON(),source:p.screens[0]};
};</script></body></html>
