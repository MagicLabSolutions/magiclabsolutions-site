<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MagicLab campaign composition master</title><style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif;background:var(--paper)}
.art{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--paper);color:var(--ink);isolation:isolate}
.scene{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:var(--position)}
.veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,color-mix(in srgb,var(--paper),transparent 6%) 0%,color-mix(in srgb,var(--paper),transparent 12%) 28%,color-mix(in srgb,var(--paper),transparent 44%) 58%,color-mix(in srgb,var(--paper),transparent 20%) 100%)}
.brand{position:absolute;left:7%;top:4%;display:flex;gap:calc(var(--w)*.014);align-items:center;font-size:calc(var(--w)*.037);font-weight:650;letter-spacing:-.02em}.brand img{width:calc(var(--w)*.055);height:calc(var(--w)*.055);border-radius:24%;object-fit:contain}
.copy{position:absolute;left:7%;right:7%;top:10.5%}.overline{font-size:calc(var(--w)*.03);font-weight:650;letter-spacing:.025em;color:var(--accent);margin:0 0 2.5%}
h1{font-size:calc(var(--w)*.096);line-height:1.04;letter-spacing:-.048em;margin:0;font-weight:780;text-wrap:balance}
.description{font-size:calc(var(--w)*.047);line-height:1.32;max-width:100%;margin:3% 0 0;text-wrap:balance;font-weight:450}
.capture-wrap{position:absolute;left:7%;right:7%;top:37%;bottom:5%;display:flex;align-items:center;justify-content:center;gap:4%;padding:0}
.device-frame{position:relative;flex:none;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.capture{display:block;max-width:100%;max-height:100%;object-fit:contain}.device-bezel{display:none}
.real .capture{position:absolute;max-width:none;max-height:none;object-fit:contain;background:var(--paper)}.real .device-bezel{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:2}
.android{height:100%;aspect-ratio:var(--screen-ratio);padding:calc(var(--w)*.009);border:2px solid #7d858d;border-radius:calc(var(--w)*.047);background:linear-gradient(110deg,#737c86,#0a0d12 18%,#151920 80%,#697482)}.android .capture{height:100%;width:100%;border-radius:calc(var(--w)*.038)}.android:after{content:'';position:absolute;top:2%;left:48%;width:4%;aspect-ratio:1;border-radius:50%;background:#07080a;border:2px solid #303844}
.macbook{width:95%;padding:calc(var(--w)*.005);border:2px solid #858a92;border-radius:calc(var(--w)*.012);background:#090b0e;margin-bottom:0}.macbook .capture{width:100%;border-radius:calc(var(--w)*.007)}.macbook:after{content:'';position:absolute;left:-4%;right:-4%;bottom:calc(var(--w)*-.011);height:calc(var(--w)*.012);background:linear-gradient(#c8cdd3,#8c939c 45%,#50555e);border-radius:2px 2px 50% 50%}
.browser{width:100%;padding:calc(var(--w)*.017) calc(var(--w)*.005) calc(var(--w)*.005);background:#f6f5f0;border:1px solid #bdbcb7;border-radius:calc(var(--w)*.013)}.browser:before{content:'● ● ●';position:absolute;top:0;left:2%;font-size:calc(var(--w)*.012);color:#8b8d90}.browser .capture{width:100%;border-radius:calc(var(--w)*.007)}
.focus{width:39%;flex:none;align-self:center;display:flex;flex-direction:column;gap:calc(var(--w)*.025);position:relative}.focus[hidden]{display:none}.focus label{font-size:calc(var(--w)*.047);line-height:1.12;font-weight:750;letter-spacing:-.025em;display:block;text-wrap:balance}.focus-card{background:var(--focus-bg);border:1px solid color-mix(in srgb,var(--accent),transparent 65%);border-radius:calc(var(--w)*.025);overflow:hidden;box-shadow:0 16px 32px #0002}.focus-card img{display:block;width:100%;height:auto}.focus .note{font-size:calc(var(--w)*.028);font-weight:600;color:var(--accent);margin:0}
.has-focus .capture-wrap{justify-content:space-between}.flip .capture-wrap{flex-direction:row-reverse}
.footer{position:absolute;bottom:2%;left:7%;right:7%;font-size:calc(var(--w)*.027);display:flex;justify-content:space-between;align-items:center;gap:4%;font-weight:600}.footer strong{max-width:86%;color:var(--accent)}.dots{display:flex;gap:calc(var(--w)*.009)}.dots i{width:calc(var(--w)*.008);height:calc(var(--w)*.008);border-radius:50%;background:var(--ink);opacity:.25}.dots i.on{background:var(--accent);opacity:1}
.social .copy{top:13%}.social h1{font-size:calc(var(--w)*.087);line-height:1.06}.social .overline{display:none}.social .description{font-size:calc(var(--w)*.043)}.social .capture-wrap{top:44%;bottom:7%;left:7%;right:7%}.social .brand{top:5%}.social .focus label{font-size:calc(var(--w)*.044)}.social .footer{font-size:calc(var(--w)*.025)}
.video .copy{top:12%;left:8%;right:8%}.video .overline{display:none}.video h1{font-size:calc(var(--w)*.09)}.video .description{font-size:calc(var(--w)*.045)}.video .capture-wrap{top:33%;bottom:15%;left:8%;right:8%}.video .brand{top:5%}.video .footer{bottom:10%;font-size:calc(var(--w)*.032);line-height:1.25}.video .focus label{font-size:calc(var(--w)*.044)}
.wide .brand{top:5%;font-size:calc(var(--w)*.027)}.wide .brand img{width:calc(var(--w)*.038);height:calc(var(--w)*.038)}.wide .copy{top:16%;left:6%;right:6%}.wide .overline{display:none}.wide h1{font-size:calc(var(--w)*.087);line-height:1.02}.wide .description{font-size:calc(var(--w)*.042);margin:1.5% 0 0}.wide .capture-wrap{top:52%;bottom:7%;left:6%;right:6%}.wide .has-focus{gap:5%}.wide .focus{width:28%;gap:calc(var(--w)*.009);height:100%;justify-content:center}.wide .focus label{font-size:calc(var(--w)*.035);line-height:1.06}.wide .focus-card{min-height:0;flex:0 1 auto}.wide .focus-card img{max-height:calc(var(--h)*.21);object-fit:contain}.wide .focus .note{display:none}.wide.has-focus .device-frame{max-width:66%}.wide .footer{font-size:calc(var(--w)*.024)}
.tablet .copy{top:12%}.tablet h1{font-size:calc(var(--w)*.084)}.tablet .description{font-size:calc(var(--w)*.044)}.tablet .capture-wrap{top:41%;bottom:6%}.tablet .focus{width:32%}.tablet .focus label{font-size:calc(var(--w)*.042)}
[data-slug=memories] h1,[data-slug=hooray] h1{font-family:Georgia,serif;font-weight:550;letter-spacing:-.04em}[data-slug=soooon] h1,[data-slug=tumtum] h1{font-family:'Arial Rounded MT Bold',-apple-system,sans-serif;letter-spacing:-.035em}[data-slug=sundust] h1{font-family:Georgia,serif;font-weight:500;letter-spacing:-.035em}
</style></head><body><main class="art" id="art"><div class="scene"></div><div class="veil"></div><div class="brand"><img id="icon" alt=""><span id="name"></span></div><div class="copy"><p class="overline" id="overline"></p><h1 id="headline"></h1><p class="description" id="description"></p></div><div class="capture-wrap"><aside class="focus" hidden><label id="focus-label"></label><div class="focus-card"><img id="detail" alt=""></div><p class="note">A closer look</p></aside><div class="device-frame" id="device"><img class="capture" id="capture" alt=""><img class="device-bezel" id="bezel" alt=""></div></div><div class="footer"><strong id="footer"></strong><span class="dots"></span></div></main><script>
window.renderArtwork=async function(p,index,format,dimensions,variant=0){
 const panel=p.panels[index],root=document.querySelector('#art');document.documentElement.style.cssText=`--paper:${p.palette[0]};--ink:${p.palette[1]};--accent:${p.palette[2]};--focus-bg:${p.palette[0]};--w:${dimensions[0]}px;--h:${dimensions[1]}px;--position:${['center center','left 58%','right 55%','center 80%'][index%4]}`;
 root.dataset.slug=p.slug;root.dataset.background=p.background;root.className='art '+(format==='carousel'?'social':format)+(dimensions[0]>dimensions[1]?' wide':'')+(p.device==='ipad'?' tablet':'');
 document.querySelector('.scene').style.backgroundImage=`url('${p.background}')`;const bg=new Image();bg.src=p.background;await bg.decode();
 document.querySelector('#name').textContent=p.name;document.querySelector('#icon').src=p.icon;
 document.querySelector('#headline').textContent=format==='social'?p.hooks[index]:format==='video'?p.steps[variant][index%3]:panel[0];
 document.querySelector('#description').textContent=format==='video'?(index===0?p.hooks[variant]:''):panel[1];document.querySelector('#overline').textContent=panel[2];
 const cap=document.querySelector('#capture'),device=document.querySelector('#device'),bezel=document.querySelector('#bezel');cap.src=p.screens[index];cap.className='capture '+p.device;cap.style.cssText='';device.className='device-frame '+(p.hardware||'browser')+(p.frame?' real':'');device.style.cssText='';if(p.frame)bezel.src=p.frame.asset;else bezel.removeAttribute('src');
 const focus=document.querySelector('.focus'),detail=document.querySelector('#detail'),f=p.details?.[index];focus.hidden=!f;root.classList.toggle('has-focus',!!f);root.classList.toggle('flip',!!f&&index%2===0);if(f){detail.src=f.asset;document.querySelector('#focus-label').textContent=p.detail_labels?.[index]||f.label;document.querySelector('.focus .note').textContent=p.detail_note||'A closer look';}else detail.removeAttribute('src');
 document.querySelector('#footer').textContent=format==='store'?'':p.cta;document.querySelector('.dots').innerHTML=p.panels.map((_,i)=>`<i class="${i===index?'on':''}"></i>`).join('');
 await Promise.all([...document.images].filter(im=>im.getAttribute('src')).map(im=>im.decode()));await document.fonts.ready;device.style.setProperty('--screen-ratio',cap.naturalWidth+'/'+cap.naturalHeight);
 const wrap=document.querySelector('.capture-wrap');wrap.style.top='';const copyBottom=document.querySelector('.copy').getBoundingClientRect().bottom;if(copyBottom>wrap.getBoundingClientRect().top-dimensions[0]*.025)wrap.style.top=(copyBottom+dimensions[0]*.04)+'px';const box=wrap.getBoundingClientRect();
 if(p.frame){const [fw,fh]=p.frame.dimensions,[x,y,w,h]=p.frame.screen;const available=box.width*(f?(p.device==='ipad'?.64:.57):1),scale=Math.min(available/fw,box.height/fh);device.style.width=fw*scale+'px';device.style.height=fh*scale+'px';cap.style.cssText=`left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%;border-radius:${(p.device==='ipad'?42:150)*scale}px`;}
 else if(p.hardware==='macbook'||p.hardware==='browser'){const available=box.width*(f?(dimensions[0]>dimensions[1]?0.65:0.57):1);device.style.width=Math.min(available,box.height*cap.naturalWidth/cap.naturalHeight*.93)+'px';}
 else if(p.hardware==='android'){const scale=Math.min(box.height/cap.naturalHeight,box.width*(f?.57:1)/cap.naturalWidth);device.style.height=cap.naturalHeight*scale+'px';}
 return {scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,headlineHeight:document.querySelector('h1').getBoundingClientRect().height};
};
</script></body></html>
