<!doctype html><html><head><meta charset="utf-8"><title>Memories · Anniversary & stories</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}.art{position:relative;overflow:hidden;isolation:isolate;color:#fff9f0;background:#302f2c}.back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#171d25ed 0%,#171d25bc 31%,#25232177 60%,#282319aa 100%)}.brand{position:absolute;display:flex;gap:24px;align-items:center;font-weight:700}.brand img{border-radius:23%}.plus{font-size:.68em;border:2px solid #fff8;border-radius:100px;padding:.15em .45em}.copy{position:absolute;z-index:6}h1{margin:0;font-weight:760;line-height:1.07;letter-spacing:-.035em;text-wrap:balance;white-space:pre-line}.desc{margin:45px 0 0;line-height:1.32;text-wrap:balance}.device{position:absolute;filter:drop-shadow(0 30px 35px #0005)}.screen,.hardware{position:absolute;display:block}.hardware{inset:0;width:100%;height:100%;z-index:2}.screen{object-fit:contain;background:#fbf6ee}.detail{position:absolute;z-index:4;overflow:hidden;outline:5px solid #fff9f0;box-shadow:0 22px 60px #0006;transform:rotate(-2deg)}.detail img{position:absolute;max-width:none}.polaroid{position:absolute;padding:16px 16px 52px;background:#fff9f0;box-shadow:0 10px 40px #0005;z-index:3;transform:rotate(12deg)}.polaroid img{width:100%;display:block;aspect-ratio:1;object-fit:cover}.sparkle{position:absolute;z-index:3;color:#ffe6a3;font-size:90px}
</style></head><body><main id="art" class="art"><img class="back" id="back"><div class="shade"></div><div class="brand"><img id="icon"><span>Memories</span><span class="plus" id="plus">Plus</span></div><div class="copy"><h1 id="title"></h1><p class="desc" id="desc"></p></div><div class="device"><img class="screen" id="screen"><img class="hardware" id="hardware"></div><div class="detail" id="detail"><img id="detail-img"></div><div class="polaroid" id="prop"><img id="prop-img"></div><span class="sparkle" id="spark">✦</span></main><script>
window.render=async c=>{
const q=s=>document.querySelector(s),W=c.width,H=c.height,pad=c.format==='ipad';Object.assign(q('#art').style,{width:W+'px',height:H+'px'});q('#art').lang=c.locale;
for(const [id,src] of [['#back',c.background],['#icon',c.icon],['#screen',c.capture],['#hardware',c.frame.asset],['#detail-img',c.capture],['#prop-img',c.prop]])q(id).src=src;
q('#plus').style.display=c.number===6?'block':'none';q('#prop').style.display=c.number===5?'none':'block';q('#title').textContent=c.headline;q('#desc').textContent=c.description;q('.copy').dir=c.direction;
const left=W*.0697;Object.assign(q('.brand').style,{left:left+'px',top:W*(pad?.055:.084)+'px',fontSize:W*.043+'px'});Object.assign(q('#icon').style,{width:W*.064+'px',height:W*.064+'px'});
Object.assign(q('.copy').style,{left:left+'px',right:left+'px',top:W*(pad?.16:.245)+'px'});Object.assign(q('h1').style,{fontSize:W*.108+'px',letterSpacing:c.direction==='rtl'?'0':'-.035em'});Object.assign(q('.desc').style,{fontSize:W*.05+'px',marginTop:W*.032+'px'});
await Promise.all([...document.images].map(i=>i.decode()));await document.fonts.ready;
const bottom=q('.copy').getBoundingClientRect().bottom,fw=c.frame.dimensions[0],fh=c.frame.dimensions[1],dw=W*.865,dx=(W-dw)/2,dy=bottom+W*.048;
Object.assign(q('.device').style,{left:dx+'px',top:dy+'px',width:dw+'px',height:dw*fh/fw+'px'});const[sx,sy,sw,sh]=c.frame.screen;Object.assign(q('#screen').style,{left:sx/fw*100+'%',top:sy/fh*100+'%',width:sw/fw*100+'%',height:sh/fh*100+'%',borderRadius:(pad?42:110)*dw/fw+'px'});
q('#detail').style.display=c.rect?'block':'none';let detail=null;if(c.rect){const[l,t,r,b]=c.rect,cw=(c.number===5?Math.min(W*.48,(H-bottom-W*.17)*(r-l)/(b-t)):W*.87),scale=cw/(r-l),ch=(b-t)*scale,cy=c.number===5?Math.min(dy+W*.24,H-ch-W*.12):Math.min(dy+W*(pad?.34:.62),H-ch-W*.1);Object.assign(q('#detail').style,{left:(c.number===5?W*.26:W*.08)+'px',top:cy+'px',width:cw+'px',height:ch+'px',borderRadius:30*scale+'px'});Object.assign(q('#detail-img').style,{width:q('#screen').naturalWidth*scale+'px',height:q('#screen').naturalHeight*scale+'px',left:-l*scale+'px',top:-t*scale+'px'});detail=q('#detail').getBoundingClientRect().toJSON();}
Object.assign(q('#prop').style,{width:W*(pad?.23:.27)+'px',left:W*.755+'px',top:H-W*.37+'px',padding:W*.013+'px '+W*.013+'px '+W*.042+'px',transform:c.number===5?'rotate(12deg)':'rotate(-13deg)'});
Object.assign(q('#spark').style,{left:W*.018+'px',top:dy+W*.19+'px',fontSize:W*.072+'px'});
return {copy:q('.copy').getBoundingClientRect().toJSON(),device:q('.device').getBoundingClientRect().toJSON(),detail,fonts:{headline:W*.108,description:W*.05},sourceSize:[q('#screen').naturalWidth,q('#screen').naturalHeight],overflow:q('.copy').scrollWidth>q('.copy').clientWidth};};
</script></body></html>
