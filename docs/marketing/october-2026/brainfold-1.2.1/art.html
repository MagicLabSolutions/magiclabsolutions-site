</main><script>
window.render=async function(c){
 const art=document.querySelector('#art'),copy=document.querySelector('.copy'),device=document.querySelector('.device'),photo=document.querySelector('#photo'),pdf=document.querySelector('#pdf'),card=document.querySelector('#card'),flow=document.querySelector('.flow');

 const mac=c.format==='mac',ipad=c.format==='ipad';

 Object.assign(copy.style,{left:preset.left+'px',right:preset.right+'px',top:preset.top+'px'});
 const brand=document.querySelector('.brand');Object.assign(brand.style,{left:preset.left+'px',top:preset.brandTop+'px',fontSize:preset.brandFont+'px'});Object.assign(document.querySelector('#icon').style,{width:preset.brandIcon+'px',height:preset.brandIcon+'px'});
 const h=document.querySelector('h1'),d=document.querySelector('.description');Object.assign(h.style,{fontSize:preset.head+'px',letterSpacing:c.direction==='rtl'?'0':(mac?-5:ipad?-5:-4)+'px',lineHeight:'1.08',overflowWrap:'anywhere',hyphens:'auto'});Object.assign(d.style,{fontSize:preset.desc+'px',lineHeight:'1.34',letterSpacing:'0',marginTop:preset.descriptionMargin+'px'});
 document.querySelector('#screen').src=c.capture;document.querySelector('#hardware').src=c.frame.asset;document.querySelector('#card-image').src=c.capture;document.querySelector('#photo-image').setAttribute('href',c.photo);
 await Promise.all([...document.images].map(im=>im.decode()));await document.fonts.ready;
 const maxHead=mac?800:ipad?790:490,maxCopy=mac?1330:ipad?1510:1220;
 while(h.getBoundingClientRect().height>maxHead&&parseFloat(h.style.fontSize)>preset.minHead)h.style.fontSize=(parseFloat(h.style.fontSize)-2)+'px';
 while(copy.getBoundingClientRect().bottom>maxCopy&&parseFloat(d.style.fontSize)>preset.minDesc)d.style.fontSize=(parseFloat(d.style.fontSize)-2)+'px';
 const bottom=copy.getBoundingClientRect().bottom;
 const fw=c.frame.dimensions[0],fh=c.frame.dimensions[1],[sx,sy,sw,sh]=c.frame.screen;
 const dw=mac?2600:ipad?1850:1108,dx=mac?140:ipad?107:106,dy=mac?bottom+90:bottom+c.width*.055;
 Object.assign(device.style,{left:dx+'px',top:dy+'px',width:dw+'px',height:dw*fh/fw+'px'});
 Object.assign(document.querySelector('#screen').style,{left:sx/fw*100+'%',top:sy/fh*100+'%',width:sw/fw*100+'%',height:sh/fh*100+'%',borderRadius:(mac?18:ipad?42:130)*dw/fw+'px',objectFit:'contain',background:'#fafaf9'});
 photo.style.display=c.import?'block':'none';pdf.style.display=c.import?'block':'none';flow.style.display=c.import?'block':'none';card.style.display=c.rect?'block':'none';
 if(c.rect){const [l,t,r,b]=c.rect,im=document.querySelector('#card-image');let cw=mac?Math.min(c.import||c.number===3?1100:1500,(c.height-bottom-190)*(r-l)/(b-t)):ipad?1450:924,scale=cw/(r-l),ch=(b-t)*scale;
  const cx=mac?c.width-110-cw:ipad?475:320;
  let cy=mac?Math.min(c.height-ch-90,Math.max(bottom+100,1240)):Math.min(c.height-ch-90,Math.max(dy+730,1830));
  if(cy<bottom+60&&!mac){cw*=.88;scale=cw/(r-l);ch=(b-t)*scale;cy=Math.min(c.height-ch-90,Math.max(dy+730,1830));}
  Object.assign(card.style,{left:cx+'px',top:cy+'px',width:cw+'px',height:ch+'px',borderRadius:c.radius*scale+'px',transform:'rotate(-2deg)'});Object.assign(im.style,{width:im.naturalWidth*scale+'px',height:im.naturalHeight*scale+'px',left:-l*scale+'px',top:-t*scale+'px'});
 }
 Object.assign(photo.style,{left:(mac?-10:ipad?-20:-12)+'px',top:(mac?Math.max(bottom+115,1220):Math.max(bottom+190,ipad?1310:1160))+'px',width:(mac?1400:ipad?1520:980)+'px'});
 Object.assign(pdf.style,{left:(mac?1470:ipad?1710:1000)+'px',top:(mac?bottom+125:Math.max(bottom+410,ipad?1510:1380))+'px',width:(mac?240:ipad?310:240)+'px'});
 Object.assign(flow.style,{left:(mac?1695:ipad?1530:910)+'px',top:(mac?bottom+370:Math.max(bottom+650,ipad?1820:1680))+'px'});
 const bounds=q=>document.querySelector(q).getBoundingClientRect().toJSON();
 return {copy:bounds('.copy'),device:bounds('.device'),card:c.rect?bounds('.card'):null,photo:c.import?bounds('.photo'):null,fonts:{headline:parseFloat(h.style.fontSize),description:parseFloat(d.style.fontSize)},sourceDimensions:[document.querySelector('#screen').naturalWidth,document.querySelector('#screen').naturalHeight],openingAspect:sw/sh,copyOverflow:copy.scrollWidth>copy.clientWidth};
