<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brainfold — Books & PDFs, English approval pilot</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111a39}body{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}
.art{position:relative;width:1320px;height:2868px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 4% 83%,#ff684920,transparent 53%),linear-gradient(160deg,#111a39,#121c3d 60%,#202139);color:#fff8f2}
.paper{position:absolute;width:1000px;height:950px;left:-400px;bottom:-160px;transform:rotate(-16deg);background:#ff684910;border:2px solid #ffb4a21a;border-radius:50px}
.brand{position:absolute;left:92px;top:110px;display:flex;gap:24px;align-items:center;font-size:52px;font-weight:650}.brand img{width:82px;height:82px;border-radius:22%}
.copy{position:absolute;left:92px;right:92px;top:340px;z-index:5}h1{margin:0;font-size:142px;font-weight:760;letter-spacing:-6.2px;line-height:1.06;white-space:pre-line}.description{margin:58px 0 0;font-size:64px;font-weight:450;line-height:1.34;letter-spacing:-1px;white-space:pre-line}
.device{position:absolute;left:106px;width:1108px;height:2261.22px}.capture,.hardware{position:absolute;display:block}.capture{left:5.10204%;top:2.2%;width:89.79592%;height:95.6%;object-fit:contain;border-radius:113px}.hardware{inset:0;width:100%;height:100%;z-index:2}
.photo{position:absolute;z-index:3;filter:drop-shadow(0 20px 30px #080d2580)}.photo svg{display:block;width:100%;height:auto}
.pdf{position:absolute;z-index:4;transform:rotate(8deg);filter:drop-shadow(0 18px 25px #0005)}.pdf svg{display:block;width:100%}
.flow{position:absolute;left:910px;top:1680px;width:175px;height:160px;z-index:4}
.card{position:absolute;overflow:hidden;z-index:4;isolation:isolate;filter:drop-shadow(0 20px 30px #0005);outline:4px solid #fff8f2;transform:rotate(-2deg)}.card img{position:absolute;display:block;max-width:none}
</style></head><body><main class="art" id="art"><div class="paper"></div>
<div class="brand"><img id="icon" alt=""><span>Brainfold</span></div>
<div class="copy"><h1 id="headline"></h1><p class="description" id="description"></p></div>
<div class="device"><img id="screen" class="capture" alt="Brainfold flashcard interface"><img id="hardware" class="hardware" alt="iPhone hardware"></div>
<div class="photo" id="photo">
<svg viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-created photograph of a book being scanned">
<defs><clipPath id="subject"><path d="M 16 958 Q 6 963 16 979 Q 23 988 48 986 L 1164 970 Q 1194 969 1194 941 L 1085 456 Q 1098 476 1141 490 Q 1178 511 1221 518 Q 1280 524 1316 540 Q 1357 555 1404 606 L 1536 711 L 1536 399 Q 1480 377 1440 346 Q 1408 323 1387 295 Q 1364 261 1342 224 Q 1294 158 1243 126 Q 1213 103 1176 102 Q 1152 79 1111 76 L 1043 80 Q 1017 80 1002 110 L 833 32 Q 800 18 771 38 L 701 102 Q 681 121 683 154 Q 683 168 703 181 L 907 306 Q 903 319 915 337 Q 926 350 948 360 L 885 352 Q 803 339 746 343 Q 634 347 576 386 Q 551 366 519 360 Q 462 348 409 346 Q 300 349 159 362 Q 140 360 133 376 L 109 387 Q 94 391 92 410 Z"/></clipPath></defs>
<image id="photo-image" width="1536" height="1024" clip-path="url(#subject)"/>
</svg></div>
<div class="pdf" id="pdf"><svg viewBox="0 0 240 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PDF file illustration"><path d="M25 5H160L232 77V283Q232 305 210 305H25Q5 305 5 283V27Q5 5 25 5Z" fill="#fff8f2"/><path d="M160 5V59Q160 77 179 77H232" fill="#efcebf"/><rect x="-8" y="140" width="247" height="103" rx="18" fill="#ff6849"/><text x="114" y="213" text-anchor="middle" fill="#fff8f2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="75" font-weight="750">PDF</text><path d="M39 99H141M39 115H168M39 267H129" stroke="#111a3933" stroke-width="7" stroke-linecap="round"/></svg></div>
<svg class="flow" viewBox="0 0 175 160" aria-hidden="true"><path d="M24 12C156 3 135 100 80 125M73 91L80 132L121 125" fill="none" stroke="#ffb7a1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="card" id="card"><img id="card-image" alt="Complete native Brainfold flashcard"></div>
</main><script>
window.renderPilot=async function(config){
 const imageSource=(relative)=>new URL(relative,location.href).href;
 document.querySelector('#icon').src=imageSource(config.icon);
 document.querySelector('#headline').textContent=config.headline;document.querySelector('#description').textContent=config.description;
 document.querySelector('#screen').src=imageSource(config.sourceScreenshot);document.querySelector('#hardware').src=imageSource(config.frame.asset);
 document.querySelector('#photo-image').setAttribute('href',imageSource(config.photo.asset));
 const photo=document.querySelector('#photo');Object.assign(photo.style,{left:config.photo.left+'px',top:config.photo.top+'px',width:config.photo.width+'px'});
 const pdf=document.querySelector('#pdf');Object.assign(pdf.style,{left:config.pdf.left+'px',top:config.pdf.top+'px',width:config.pdf.width+'px'});
 const [left,top,right,bottom]=config.flashcard.rect,scale=config.flashcard.width/(right-left),card=document.querySelector('#card'),cardImage=document.querySelector('#card-image');
 cardImage.src=imageSource(config.sourceScreenshot);await Promise.all([...document.images].map(im=>im.decode()));await document.fonts.ready;
 card.style.cssText=`left:${config.flashcard.left}px;top:${config.flashcard.top}px;width:${config.flashcard.width}px;height:${(bottom-top)*scale}px;border-radius:${config.flashcard.radius*scale}px;transform:rotate(${config.flashcard.angle}deg)`;
 cardImage.style.cssText=`width:${cardImage.naturalWidth*scale}px;height:${cardImage.naturalHeight*scale}px;left:${-left*scale}px;top:${-top*scale}px`;
 const copy=document.querySelector('.copy').getBoundingClientRect();document.querySelector('.device').style.top=copy.bottom+1320*.055+'px';
 const bounds=selector=>document.querySelector(selector).getBoundingClientRect().toJSON();
 return {copy:bounds('.copy'),headline:bounds('#headline'),description:bounds('#description'),device:bounds('.device'),card:bounds('.card'),photo:bounds('.photo'),pdf:bounds('.pdf'),fonts:{headline:parseFloat(getComputedStyle(document.querySelector('h1')).fontSize),description:parseFloat(getComputedStyle(document.querySelector('.description')).fontSize)},nativeSize:[cardImage.naturalWidth,cardImage.naturalHeight],frame:config.frame,cutoutRect:config.flashcard.rect};
};
</script></body></html>
