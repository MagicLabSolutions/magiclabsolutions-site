<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainfold · Mac screenshot correction</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#242b35;font:18px/1.5 system-ui}main{max-width:1560px;margin:auto;padding:24px}h1{font-size:clamp(30px,5vw,54px);line-height:1.15}select{font:inherit;padding:12px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(390px,100%),1fr));gap:20px}article{padding:14px;background:white;border-radius:18px}img{display:block;width:100%;height:auto}p{max-width:75ch}</style><main><h1>Brainfold. A clearer Mac story.</h1><p>Seven native desktop screenshots. The complete Mac display stays visible, with books and PDFs at position two. Localized copy fits beside the interface.</p><label>Language <select id="language"></select></label><div class="grid" id="images"></div></main><script>fetch('validation.json').then(r=>r.json()).then(data=>{const select=document.querySelector('#language'),out=document.querySelector('#images'),locales=[...new Set(data.records.map(r=>r.locale))].sort((a,b)=>a==='en-US'?-1:b==='en-US'?1:a.localeCompare(b));for(const locale of locales)select.add(new Option(locale,locale));function show(){out.replaceChildren();for(const r of data.records.filter(r=>r.locale===select.value)){const article=document.createElement('article'),image=document.createElement('img'),title=document.createElement('p');image.src='previews/'+r.locale+'/mac-store-'+r.number+'.jpg';image.alt=r.copy.headline;title.textContent=r.number+'. '+r.copy.headline;article.append(image,title);out.append(article)}}select.onchange=show;show()});</script></html>
