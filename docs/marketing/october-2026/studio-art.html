<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MagicLab — layered studio artwork</title><style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}
.art{position:relative;width:var(--w);height:var(--h);overflow:hidden;isolation:isolate;background:var(--paper);color:var(--ink)}
.scene,.veil{position:absolute;inset:0;z-index:-3;background-size:cover;background-position:center}.veil{z-index:-2;background:linear-gradient(160deg,color-mix(in srgb,var(--paper),transparent 2%) 0%,color-mix(in srgb,var(--paper),transparent 5%) 36%,color-mix(in srgb,var(--paper),transparent 35%) 100%)}
.art.hero{color:#fff}.hero .veil{background:linear-gradient(180deg,#0b101cdc 0%,#0b101c99 26%,#0b101c18 48%,#0b101c33 100%)}
.brand{position:absolute;left:7%;top:4%;display:flex;align-items:center;gap:calc(var(--w)*.018);font-size:calc(var(--w)*.039);font-weight:650}.brand img{width:calc(var(--w)*.062);height:calc(var(--w)*.062);border-radius:24%}
.copy{position:absolute;left:7%;right:7%;top:12%;z-index:5}h1{margin:0;font-size:calc(var(--w)*.108);font-weight:760;letter-spacing:-.045em;line-height:1.05;white-space:pre-line}.description{font-size:calc(var(--w)*.049);line-height:1.35;margin:5% 0 0;white-space:pre-line;font-weight:450}
.capture-wrap{position:absolute;left:8%;right:8%;top:43%;bottom:0;display:flex;justify-content:center;align-items:flex-start}.device-frame{position:relative;flex:none}.capture{position:absolute;object-fit:contain}.device-bezel{position:absolute;inset:0;width:100%;height:100%;z-index:2}.device-frame img{display:block}
.cutouts{position:absolute;inset:0;pointer-events:none;z-index:4}.ui-cutout{position:absolute;overflow:hidden;transform:rotate(var(--angle,0deg));border-radius:var(--radius);filter:drop-shadow(0 18px 24px #0003);outline:calc(var(--w)*.003) solid #fff9;isolation:isolate}.ui-cutout img{position:absolute;display:block;max-width:none}.prop{position:absolute;object-fit:contain;z-index:3;pointer-events:none}.hero .prop{display:none}
.accent-sheet{position:absolute;z-index:-1;width:70%;height:44%;right:-18%;bottom:-3%;background:color-mix(in srgb,var(--accent),var(--paper) 85%);transform:rotate(-13deg);border:calc(var(--w)*.005) solid color-mix(in srgb,var(--ink),transparent 85%)}.hero .accent-sheet{display:none}.accent-sheet{opacity:.35}.game h1{font-family:Arial Rounded MT Bold,-apple-system,sans-serif;letter-spacing:-.04em}.game .veil{background:linear-gradient(180deg,#09152bdd,#09152b66 40%,#09152b00 85%)}.game .accent-sheet{display:none}
.tablet .capture-wrap{left:5%;right:5%}.tablet h1{font-size:calc(var(--w)*.096)}.tablet .description{font-size:calc(var(--w)*.047);margin-top:3%}.tablet .brand{font-size:calc(var(--w)*.035)}.tablet .brand img{width:calc(var(--w)*.054);height:calc(var(--w)*.054)}
.wide .copy{top:12%;left:6%;right:6%}.wide h1{font-size:calc(var(--w)*.095);line-height:1}.wide .description{font-size:calc(var(--w)*.046);margin-top:2%}.wide .brand{top:3%;left:6%;font-size:calc(var(--w)*.027)}.wide .brand img{width:calc(var(--w)*.04);height:calc(var(--w)*.04)}.wide .capture-wrap{top:46%;left:8%;right:8%}
.mac .device-frame,.browser .device-frame{border:calc(var(--w)*.007) solid #29303e;border-radius:calc(var(--w)*.012);background:#111;box-shadow:0 24px 70px #0004;overflow:visible}.mac .device-frame:after{content:'';position:absolute;left:-7%;right:-7%;bottom:calc(var(--w)*-.022);height:calc(var(--w)*.025);background:linear-gradient(#b6bac6,#707685);border-radius:0 0 30% 30%;z-index:3}.browser .device-frame{padding-top:calc(var(--w)*.022);border-color:#faf7ef;background:#faf7ef}.browser .device-frame:before{content:'● ● ●';position:absolute;top:calc(var(--w)*-.002);left:1%;font-size:calc(var(--w)*.013);color:#c87e65;letter-spacing:.2em}.mac .capture,.browser .capture{position:relative;width:100%;height:auto}
.android:not(.real-hardware) .device-frame{border:calc(var(--w)*.014) solid #202229;border-radius:calc(var(--w)*.07);background:#202229;overflow:hidden;box-shadow:0 18px 55px #0004}.android:not(.real-hardware) .device-frame:after{content:'';position:absolute;width:calc(var(--w)*.025);height:calc(var(--w)*.025);border-radius:50%;background:#141414;top:1%;left:calc(50% - var(--w)*.0125);z-index:3}.android:not(.real-hardware) .capture{position:relative;width:100%;height:auto}
</style></head><body><main class="art" id="art"><div class="scene"></div><div class="veil"></div><div class="accent-sheet"></div><div class="brand"><img id="icon" alt=""><span id="name"></span></div><div class="copy"><h1 id="headline"></h1><p class="description" id="description"></p></div><div id="props"></div><div class="capture-wrap"><div class="device-frame" id="device"><img class="capture" id="capture" alt=""><img class="device-bezel" id="bezel" alt=""></div></div><div class="cutouts" id="cutouts"></div></main><script>
window.renderArtwork=async function(p,index,format,dimensions){
 const art=document.querySelector('#art'),tablet=p.device==='ipad',wide=dimensions[0]>dimensions[1],cfg=p.studio_art;
 const platform=tablet?'ipad':p.device==='android'?'android':'primary',variant=cfg[platform]||cfg;
 document.documentElement.style.cssText=`--w:${dimensions[0]}px;--h:${dimensions[1]}px;--paper:${p.palette[0]};--ink:${p.palette[1]};--accent:${p.palette[2]}`;
 art.className='art '+(tablet?'tablet ':'')+(wide?'wide ':'')+p.device+(p.frame?' real-hardware':'')+(index===0?' hero':'')+(cfg.game?' game':'');const background=(cfg.backgrounds||[])[index]||(index===0&&cfg.hero_background?cfg.hero_background:p.background);art.dataset.background=background;
 document.querySelector('.scene').style.backgroundImage=`url('${background}')`;const bg=new Image();bg.src=background;await bg.decode();
 document.querySelector('#icon').src=p.icon;document.querySelector('#name').textContent=p.name;
 const words=variant.copy||cfg.copy;document.querySelector('#headline').textContent=words[index][0];document.querySelector('#description').textContent=words[index][1];
 const cap=document.querySelector('#capture'),device=document.querySelector('#device'),bezel=document.querySelector('#bezel');cap.src=p.screens[index];cap.style.cssText='';device.style.cssText='';
 if(p.frame){bezel.src=p.frame.asset;bezel.hidden=false}else{bezel.removeAttribute('src');bezel.hidden=true}
 document.querySelector('#cutouts').replaceChildren();document.querySelector('#props').replaceChildren();
 for(const prop of cfg.props||[]){if(prop.panels&&!prop.panels.includes(index))continue;const im=document.createElement('img');im.className='prop';im.src=prop.asset;im.alt='';im.style.cssText=`width:${prop.width*100}%;left:${prop.left*100}%;transform:rotate(${prop.angle||0}deg);${prop.top!=null?'top:'+prop.top*100+'%;':'bottom:'+(prop.bottom||0)*100+'%;'}`;document.querySelector('#props').append(im)}
 await Promise.all([...document.images].filter(im=>im.getAttribute('src')).map(im=>im.decode()));await document.fonts.ready;
 const wrap=document.querySelector('.capture-wrap');const compact=variant.compact_from!=null&&index>=variant.compact_from;const naturalTop=(variant.device_tops?.[index]??variant.device_top??cfg.device_top??(wide?.46:.43))*dimensions[1];const copyBottom=document.querySelector('.copy').getBoundingClientRect().bottom;wrap.style.top=(compact?copyBottom+dimensions[0]*.055:Math.max(naturalTop,copyBottom+dimensions[0]*.025))+'px';
 if(p.frame){const [fw,fh]=p.frame.dimensions,[x,y,w,h]=p.frame.screen,scale=wrap.getBoundingClientRect().width/fw;device.style.cssText=`width:${fw*scale}px;height:${fh*scale}px`;cap.style.cssText=`left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%;border-radius:${(p.frame.radius||(tablet?42:150))*scale}px`}
 else{device.style.width=wrap.getBoundingClientRect().width+'px';if(p.device==='android')device.style.width=(wrap.getBoundingClientRect().width*.96)+'px'}
 for(const c of variant.cutouts[index]){const [l,t,r,b]=c.rect,width=dimensions[0]*c.width,s=width/(r-l),el=document.createElement('div'),im=document.createElement('img');el.className='ui-cutout';el.dataset.source=c.source;el.dataset.rect=JSON.stringify(c.rect);el.style.cssText=`left:${c.left*100}%;top:${c.top*100}%;width:${width}px;height:${(b-t)*s}px;--radius:${c.radius*s}px;--angle:${c.angle||0}deg`;im.src=c.source;await im.decode();im.style.cssText=`width:${im.naturalWidth*s}px;height:${im.naturalHeight*s}px;left:${-l*s}px;top:${-t*s}px`;el.append(im);document.querySelector('#cutouts').append(el)}
 return {scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight};
};
</script></body></html>
