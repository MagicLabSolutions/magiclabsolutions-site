<!doctype html><html lang="en"><meta charset="utf-8"><title>My Renewals native Mac store artwork</title><style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}.art{position:relative;width:2880px;height:1800px;overflow:hidden;isolation:isolate;background:#ecf7fa;color:#152b37}.scene,.veil{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:45% 58%}.veil{z-index:-1;background:linear-gradient(110deg,#ecf7fafc 2%,#ecf7faed 40%,#ecf7fa55 100%)}.brand{position:absolute;left:130px;top:80px;display:flex;align-items:center;gap:24px;font-size:62px;font-weight:650}.brand img{width:94px;height:94px;border-radius:23%}.copy{position:absolute;left:130px;top:270px;width:1200px;z-index:5}h1{margin:0;font-size:236px;font-weight:760;letter-spacing:-.04em;line-height:1.06;text-wrap:balance;overflow-wrap:normal;hyphens:none}.description{margin:70px 0 0;font-size:118px;line-height:1.26;text-wrap:balance;overflow-wrap:normal}.device{position:absolute;left:1230px;top:340px;width:2080px;height:1386.667px;filter:drop-shadow(0 34px 55px #152b3740)}.hardware,.native,.display{position:absolute;display:block}.hardware{inset:0;width:100%;height:100%;z-index:2}.display{background:#fff}.native{object-fit:contain;background:#fff;border-radius:8px}.cutout{position:absolute;z-index:4;overflow:hidden;outline:6px solid #fff;box-shadow:0 25px 60px #152b3738;transform:rotate(-2deg);background:#f6f7f8}.cutout img{position:absolute;max-width:none;display:block}[data-panel="2"] .scene{background-position:90% 45%}[data-panel="3"] .scene{background-position:15% 70%}[data-panel="5"] .veil{background:linear-gradient(110deg,#e8f5f8fd,#e8f5f8ee 40%,#e8f5f87c)}[dir="rtl"] h1{letter-spacing:0}
</style><main class="art" id="art"><div class="scene"></div><div class="veil"></div><div class="brand"><img id="icon" alt=""><span>My Renewals</span></div><div class="copy"><h1></h1><p class="description"></p></div><div class="device"><div class="display"></div><img class="native" alt="Current My Renewals Mac Catalyst interface"><img class="hardware" alt="Original Apple MacBook Pro hardware"></div><div class="cutout"><img alt="Complete native interface component"></div></main><script>
window.render=async c=>{
 document.documentElement.lang=c.locale;const art=document.querySelector('#art');art.dataset.panel=c.number;document.querySelector('.copy').dir=c.direction;
 document.querySelector('.scene').style.backgroundImage=`url("${c.background}")`;document.querySelector('#icon').src=c.icon;
 document.querySelector('h1').textContent=c.headline.replaceAll('\n',' ');document.querySelector('.description').textContent=c.description.replaceAll('\n',' ');
 const native=document.querySelector('.native');native.src=c.capture;document.querySelector('.hardware').src=c.frame.asset;document.querySelector('.cutout img').src=c.capture;
 const copy=document.querySelector('.copy'),device=document.querySelector('.device');Object.assign(copy.style,{left:(c.wide?140:130)+'px',top:(c.wide?230:270)+'px',width:(c.wide?2600:1200)+'px',textAlign:c.wide?'center':'start'});Object.assign(device.style,{left:(c.wide?140:1230)+'px',width:(c.wide?2600:2080)+'px',height:(c.wide?2600:2080)*2840/4260+'px'});
 const [x,y,w,h]=c.frame.screen,[fw,fh]=c.frame.dimensions;Object.assign(document.querySelector('.display').style,{left:x/fw*100+'%',top:y/fh*100+'%',width:w/fw*100+'%',height:h/fh*100+'%'});Object.assign(native.style,{left:x/fw*100+'%',top:(y+72)/fh*100+'%',width:w/fw*100+'%',height:(h-72)/fh*100+'%'});
 await Promise.all([...document.images].map(i=>i.decode()));await document.fonts.ready;
 device.style.top=(c.wide?copy.getBoundingClientRect().bottom+70:340)+'px';
 const cut=document.querySelector('.cutout');cut.style.display=c.rect?'block':'none';
 if(c.rect){const [l,t,r,b]=c.rect,cw=c.wide?1450:1250,scale=cw/(r-l),ch=(b-t)*scale;const cy=1760-ch;Object.assign(cut.style,{left:(c.wide?1320:1510)+'px',top:cy+'px',width:cw+'px',height:ch+'px',borderRadius:28*scale+'px'});Object.assign(cut.firstElementChild.style,{width:native.naturalWidth*scale+'px',height:native.naturalHeight*scale+'px',left:-l*scale+'px',top:-t*scale+'px'});}
 const bounds=q=>document.querySelector(q).getBoundingClientRect().toJSON();
 return {copy:bounds('.copy'),device:bounds('.device'),card:c.rect?bounds('.cutout'):null,source:[native.naturalWidth,native.naturalHeight],nativeContentInset:72,wideLayout:!!c.wide,headline:236,description:118,copyOverflow:document.querySelector('.copy').scrollWidth>(c.wide?2600:1200)};
};
</script></html>
