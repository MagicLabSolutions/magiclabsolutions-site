<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MagicLab social composition</title><style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,'Avenir Next',sans-serif}
.art{width:var(--w);height:var(--h);position:relative;overflow:hidden;isolation:isolate;background:var(--paper);color:var(--ink)}
.scene,.veil{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}.veil{z-index:-1;background:linear-gradient(180deg,var(--paper),color-mix(in srgb,var(--paper),transparent 6%) 42%,color-mix(in srgb,var(--paper),transparent 35%))}
.hero{color:#fff}.hero .veil{background:linear-gradient(180deg,#101522db,#10152299 35%,#10152218)}
.brand{position:absolute;left:7%;top:4%;display:flex;gap:18px;align-items:center;font-size:calc(var(--w)*.038);font-weight:650}.brand img{width:calc(var(--w)*.063);height:calc(var(--w)*.063);border-radius:24%}
.copy{position:absolute;left:7%;right:7%;top:14%;z-index:5}h1{font-size:calc(var(--w)*.096);font-weight:760;line-height:1.03;letter-spacing:-.045em;margin:0;white-space:pre-line}.description{font-size:calc(var(--w)*.047);line-height:1.3;margin:3% 0 0;white-space:pre-line}
.capture-wrap{position:absolute;left:12%;right:12%;display:flex;justify-content:center;align-items:flex-start}.device-frame{position:relative;flex:none}.capture{position:absolute;object-fit:contain}.device-bezel{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.mac .capture-wrap,.web .capture-wrap{left:6%;right:6%}.mac .device-frame,.web .device-frame{border:8px solid #29313d;border-radius:15px;background:#111;box-shadow:0 20px 45px #0004}.mac .capture,.web .capture{position:relative;display:block;width:100%;height:auto}.web .device-frame{border-color:#faf6ed;padding-top:22px}.web .device-frame:before{content:'● ● ●';position:absolute;top:0;left:2%;color:#b58669;font-size:15px;letter-spacing:5px}
.cutouts{position:absolute;inset:0;pointer-events:none;z-index:4}.ui-cutout{position:absolute;overflow:hidden;filter:drop-shadow(0 14px 22px #0003);outline:3px solid #ffffffcc}.ui-cutout img{position:absolute;max-width:none}.prop{position:absolute;width:22%;bottom:-1%;right:-3%;z-index:3;transform:rotate(8deg)}
.footer{position:absolute;bottom:0;left:0;right:0;min-height:7%;padding:2% 7%;background:var(--paper);color:var(--ink);font-size:calc(var(--w)*.031);font-weight:650;z-index:5;display:flex;justify-content:space-between;align-items:center}.footer span{opacity:.65;font-size:calc(var(--w)*.024)}.game .capture-wrap{left:12%;right:12%}.game .veil{background:linear-gradient(#09152bf0,#09152b00)}
</style></head><body><main class="art" id="art"><div class="scene"></div><div class="veil"></div><div class="brand"><img id="icon" alt=""><span id="name"></span></div><div class="copy"><h1></h1><p class="description" id="description"></p></div><div class="capture-wrap"><div class="device-frame" id="device"><img class="capture" id="capture" alt=""><img class="device-bezel" id="bezel" alt=""></div></div><div class="cutouts"></div><div id="props"></div><div class="footer"><strong></strong><span></span></div></main><script>
window.renderArtwork=async(p,index,format,size)=>{
 if(p.social_platform==='ipad')p={...p,...p.ipad_store};
 const n=index%p.screens.length,cfg=p.studio_art||p.store_pilot||{},native=(p.device==='ipad'?cfg.ipad:cfg.primary)||cfg,words=(cfg.copy||p.panels)[n],art=document.querySelector('#art');
 document.documentElement.style.cssText=`--w:${size[0]}px;--h:${size[1]}px;--paper:${p.palette[0]};--ink:${p.palette[1]}`;
 art.className='art '+p.device+(index===0?' hero':'')+(cfg.game?' game':'');const bg=(cfg.backgrounds||[])[n]||(index===0&&cfg.hero_background?cfg.hero_background:p.background);art.dataset.background=bg;document.querySelector('.scene').style.backgroundImage=`url('${bg}')`;let image=new Image();image.src=bg;await image.decode();
 document.querySelector('#icon').src=p.icon;document.querySelector('#name').textContent=p.name;
 document.querySelector('h1').textContent=(p.social_copy?.[index]||words)[0];document.querySelector('#description').textContent=(p.social_copy?.[index]||words)[1];
 const cap=document.querySelector('#capture'),device=document.querySelector('#device'),bezel=document.querySelector('#bezel'),wrap=document.querySelector('.capture-wrap');cap.src=p.screens[n];cap.style.cssText='';device.style.cssText='';bezel.hidden=!p.frame;if(p.frame)bezel.src=p.frame.asset;else bezel.removeAttribute('src');document.querySelector('.cutouts').replaceChildren();document.querySelector('#props').replaceChildren();
 document.querySelector('.footer strong').textContent=p.cta;document.querySelector('.footer span').textContent='magiclabsolutions.com';
 await Promise.all([...document.images].filter(i=>i.getAttribute('src')).map(i=>i.decode()));await document.fonts.ready;
 wrap.style.top=(document.querySelector('.copy').getBoundingClientRect().bottom+size[0]*.05)+'px';
 if(p.frame){const [fw,fh]=p.frame.dimensions,[x,y,w,h]=p.frame.screen,s=wrap.getBoundingClientRect().width/fw;device.style.cssText=`width:${fw*s}px;height:${fh*s}px`;cap.style.cssText=`left:${x/fw*100}%;top:${y/fh*100}%;width:${w/fw*100}%;height:${h/fh*100}%;border-radius:${(p.frame.radius||(p.device==='ipad'?42:150))*s}px`}
 else device.style.width=wrap.getBoundingClientRect().width+'px';
 // A whole native card, over the hardware, never a broken side column.
 const c=(native.cutouts?.[n]||[])[0];
 if(c&&index%2===1&&(c.rect[2]-c.rect[0])/(c.rect[3]-c.rect[1])>=2){const [l,t,r,b]=c.rect;let w=Math.min(size[0]*.87,size[1]*.235*(r-l)/(b-t)),s=w/(r-l),h=(b-t)*s,el=document.createElement('div'),im=document.createElement('img');el.className='ui-cutout';el.dataset.source=c.source;el.dataset.rect=JSON.stringify(c.rect);el.style.cssText=`width:${w}px;height:${h}px;left:${size[0]*.065}px;top:${size[1]*.9-h}px;border-radius:${c.radius*s}px;transform:rotate(-2deg)`;im.src=c.source;await im.decode();im.style.cssText=`width:${im.naturalWidth*s}px;height:${im.naturalHeight*s}px;left:${-l*s}px;top:${-t*s}px`;el.append(im);document.querySelector('.cutouts').append(el)}
 const prop=(cfg.props||[]).find(x=>!x.panels||x.panels.includes(n));if(prop&&index>0){const im=document.createElement('img');im.src=prop.asset;im.className='prop';im.alt='';await im.decode();document.querySelector('#props').append(im)}
 return {scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight};
};</script></body></html>
