{% assign crop = include.crop %}
<div class="l-component" aria-hidden="true" style="aspect-ratio:{{ crop.ratio }};--component-angle:{{ crop.angle }}deg;border-radius:{{ crop.radius }}% / {{ crop.radius | times: crop.ratio }}%">
  <img src="{{ crop.image.src | relative_url }}" alt="" loading="lazy" style="width:{{ crop.width }}%;left:{{ crop.left }}%;top:{{ crop.top }}%">
</div>
