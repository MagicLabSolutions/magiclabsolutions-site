{% assign crop = include.crop %}
{% if crop.rendered.src %}
<div class="l-component" aria-hidden="true" style="--component-angle:{{ crop.angle }}deg;border-radius:{{ crop.radius }}% / {{ crop.radius | times: crop.ratio }}%">
  <img data-native-component src="{{ crop.rendered.src | relative_url }}" alt="" width="{{ crop.rendered.width }}" height="{{ crop.rendered.height }}" {% if include.hero %}loading="eager"{% else %}loading="lazy"{% endif %}>
</div>
{% endif %}
